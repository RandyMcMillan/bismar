[package]
name = "bismar"
version = "0.1.8"
edition = "2021"
description = "Browse, weigh, and diff packages from npm, jsr, crates.io, rubygems, pypi, packagist, github"
authors = ["Paul Miller <https://paulmillr.com>"]
license = "MIT"
repository = "https://github.com/paulmillr/bismar"
keywords = ["bundle", "bundler", "size", "diff", "registry"]

[[bin]]
name = "bismar"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
flate2 = "1.0"
once_cell = "1.20"
ratatui = "0.29"
regex = "1.11"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = { version = "2.7", features = ["unicode"] }
tar = "0.4"
tempfile = "3.20"
tokio = { version = "1.46", features = ["full"] }
zip = ">=2.0, <2.5"
hex = "0.4"
hex-literal = "0.4"
num_cpus = "1.16"
miniz_oxide = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
