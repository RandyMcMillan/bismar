name: CI bismar-rs
on:
  push:
  pull_request:
jobs:
  build-and-test:
    name: Build and test bismar-rs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bismar-rs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bismar-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('bismar-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Cargo check
        run: cargo check --locked
      - name: Check formatting
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked
      - name: Run bismar for Cargo.toml dependencies
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import tomllib

          cargo_toml = pathlib.Path("Cargo.toml")
          dependencies = tomllib.loads(cargo_toml.read_text()).get("dependencies", {})

          for dep in dependencies:
            selector = f"rs:{dep}"
            print(f"::group::bismar {selector}")
            subprocess.run(["cargo", "run", "--locked", "--", "-s", selector], check=True)
            print("::endgroup::")
          PY
      - name: Run bismar for package.json npm selectors
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          name_re = re.compile(r"^(@[\w.-]+/)?[\w.-]+$")

          def valid_name(name: str) -> bool:
            return bool(name) and bool(name_re.fullmatch(name)) and (
              not name.startswith("@") or name.count("/") == 1
            )

          package_json = pathlib.Path("../package.json")
          data = json.loads(package_json.read_text())
          dependencies = {**data.get("dependencies", {}), **data.get("devDependencies", {})}

          names = []
          package_name = data.get("name", "")
          if valid_name(package_name):
            names.append(package_name)
          for dep in dependencies:
            if valid_name(dep) and dep not in names:
              names.append(dep)

          for name in names:
            selector = f"npm:{name}"
            print(f"::group::bismar {selector}")
            subprocess.run(["cargo", "run", "--locked", "--", "-l", selector], check=True)
            print("::endgroup::")
          PY
      - name: Test
        run: cargo test --locked
