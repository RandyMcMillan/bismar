name: CI bismar-rs
on:
  push:
  pull_request:
jobs:
  build-and-test:
    name: Build and test bismar-rs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bismar-rs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bismar-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('bismar-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Cargo check
        run: cargo check --locked
      - name: Check formatting
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked
      - name: Run bismar for the bismar package
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import tomllib

          cargo_toml = pathlib.Path("Cargo.toml")
          package_name = tomllib.loads(cargo_toml.read_text()).get("package", {}).get("name", "")

          if package_name:
            selector = f"rs:{package_name}"
            print(f"::group::bismar {selector}")
            subprocess.run(["cargo", "run", "--locked", "--", "-s", selector], check=True)
            print("::endgroup::")
          PY
      - name: Run bismar for Cargo.toml dependencies
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import tomllib

          cargo_toml = pathlib.Path("Cargo.toml")
          dependencies = tomllib.loads(cargo_toml.read_text()).get("dependencies", {})

          for dep in dependencies:
            selector = f"rs:{dep}"
            print(f"::group::bismar {selector}")
            subprocess.run(["cargo", "run", "--locked", "--", "-s", selector], check=True)
            print("::endgroup::")
          PY
      - name: Test
        run: cargo test --locked
